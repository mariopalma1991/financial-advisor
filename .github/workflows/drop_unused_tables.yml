name: drop_unused_tables

# One-off: applies db/migrations/0013 (drops two empty, unused tables).
# Removed from the branch right after it runs.

on:
  push:
    branches: [claude/project-thread-05xrjc]
    paths: [.github/workflows/drop_unused_tables.yml]

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Drop
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          from src.storage.supabase_client import pg_connection
          sql = Path("db/migrations/0013_drop_unused_tables.sql").read_text(encoding="utf-8")
          with pg_connection() as conn, conn.cursor() as cur:
              cur.execute(sql)
              cur.execute("select to_regclass('raw_financial_reports'), to_regclass('raw_visa_applications')")
              print("after drop:", cur.fetchone())
          PY
