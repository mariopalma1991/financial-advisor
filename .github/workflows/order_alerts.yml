name: order_alerts

# The investor's orders for the next trading day, posted to Slack (src/jobs/order_alerts.py,
# config/order_alerts.yaml). Runs after each committee_portfolio run that updated the
# books, and each weekday morning in case the committee or the chain ran late.

on:
  workflow_run:
    workflows: [committee_portfolio]
    types: [completed]
  schedule:
    - cron: "5 14 * * 1-5"    # 08:05 CST: sends what is there if the committee hasn't reviewed a buy
    - cron: "30 17 * * 1-5"   # 11:30 CST: again, in case GitHub delayed the first
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show the list in the run summary (no Slack, nothing recorded)"
        type: boolean
        required: false
        default: true

concurrency:
  group: order-alerts
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check the books were just updated
        id: changed
        if: github.event_name == 'workflow_run'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pip install -q psycopg2-binary
          python - <<'PY'
          import os, psycopg2
          from urllib.parse import quote, unquote
          # the password may hold '@' or ':' (same fix as supabase_client._quote_password,
          # inlined so this check needs no checkout or install)
          url = os.environ["SUPABASE_DB_URL"]
          scheme, _, rest = url.partition("://")
          if rest.count("@") >= 2:
              creds, host = rest.rsplit("@", 1)
              user, _, password = creds.partition(":")
              url = f"{scheme}://{user}:{quote(unquote(password), safe='')}@{host}"
          with psycopg2.connect(url) as conn, conn.cursor() as cur:
              # committee_portfolio also completes when its own check skipped the update
              cur.execute("select coalesce(max(computed_at) > now() - interval '30 minutes', false) "
                          "from paper_nav where portfolio like 'capa4_%'")
              run = bool(cur.fetchone()[0])
          print(f"Capa 4 books updated in the last 30 minutes: {run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={str(run).lower()}\n")
          PY

      - uses: actions/checkout@v5
        if: steps.changed.outputs.run != 'false'

      - uses: actions/setup-python@v6
        if: steps.changed.outputs.run != 'false'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        if: steps.changed.outputs.run != 'false'
        run: pip install -e .

      - name: Orders
        if: steps.changed.outputs.run != 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # a channel just for orders, else the pipeline's; ALERT_WEBHOOK_URL itself is not
          # passed, so this job's runs don't also post a job summary there
          ORDERS_WEBHOOK_URL: ${{ secrets.ORDERS_WEBHOOK_URL || secrets.ALERT_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: python -m src.jobs.order_alerts $([ "$DRY_RUN" = true ] && echo --dry-run)
