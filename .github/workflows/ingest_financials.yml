name: ingest_financials

# Financials as reported from Finnhub. Manual only: fundamentals now come from
# /stock/metric (ingest_fundamentals), and this job cost ~46 min of Finnhub quota
# a week (10-Q values are year-to-date and there are no 10-Ks, so agents can't use them).

on:
  workflow_dispatch: {}

# Finnhub allows 30 calls/min for the whole account, so Finnhub workflows run
# one at a time: a run queues while another holds the group. GitHub keeps only
# the newest pending run per group; an older pending one is cancelled.
concurrency:
  group: finnhub-api
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Ingest financials (Finnhub)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m src.jobs.ingest_financials