name: monitor_health

# Daily health check (src/jobs/monitor_health.py, config/monitoring.yaml):
# last successful run per job, table freshness and free-plan budgets.
# A failed check fails this workflow, so GitHub sends the failure email.

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor-health
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Run health checks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m src.jobs.monitor_health
