name: daily_pipeline

# Derived data pipeline: indicators → screener → feeds.
# Runs daily at 10:00 UTC (~4am Mexico City), after all source ingestion jobs
# (prices, news, filings, financials, earnings, earncal) have completed.
#
# Source-specific pipelines are separate:
#   - ingest_prices (02:00 UTC Mon-Sat)
#   - ingest_news (13:00, 19:00, 23:00 UTC daily)
#   - ingest_filings (14:00 UTC Mon-Sat)
#   - ingest_financials (16:00 UTC Monday)
#   - ingest_earnings (17:00 UTC Monday)
#   - ingest_earncal (18:00 UTC Monday)
#   - ingest_visa (12:00 UTC 1st of month)

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Compute indicators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m src.jobs.compute_indicators

      - name: Run screener
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m src.jobs.run_screener

      - name: Build feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m src.jobs.build_feeds
