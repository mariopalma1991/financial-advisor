name: backfill_gaps

# Manual: refill data missed by failed / timed-out pipeline runs.
# Detects where each source's stored data stops and re-fetches the whole
# universe from there. Idempotent. See src/jobs/backfill_gaps.py.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated: prices,news,filings"
        required: false
        default: "prices,news,filings"
      since:
        description: "Optional start date YYYY-MM-DD (blank = auto-detect)"
        required: false
        default: ""
      max_days:
        description: "Never reach back further than this many days"
        required: false
        default: "30"
      dry_run:
        description: "Only show the detected gaps"
        type: boolean
        required: false
        default: false

# Never overlap with itself (shared Finnhub rate limit).
concurrency:
  group: backfill_gaps
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Backfill gaps
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SOURCES: ${{ inputs.sources }}
          SINCE: ${{ inputs.since }}
          MAX_DAYS: ${{ inputs.max_days }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=(--sources "$SOURCES" --max-days "$MAX_DAYS")
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          set +e
          python -m src.jobs.backfill_gaps "${args[@]}" 2>&1 | tee backfill_summary.txt
          rc=${PIPESTATUS[0]}
          {
            echo '### Backfill gaps'
            echo '```'
            grep -E '^(prices|news|filings) |^===|^!!!|^Failed|^All backfills' backfill_summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
