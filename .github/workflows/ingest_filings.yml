name: ingest_filings

# Daily SEC filing lists from EDGAR (the forms in platform.yaml keep_forms).
# Runs 14:00 UTC Mon-Sat (~8am Mexico City), before enrich_filings at 15:00.

on:
  # No `schedule:` here: GitHub's cron ran hours late. Supabase pg_cron job `dispatch_ingest_filings` fires workflow_dispatch on time (db/0028_dispatch_all.sql).
  workflow_dispatch:
    inputs:
      days:
        description: "Look back N days (default 30 from platform.yaml)"
        required: false
        default: ""

# EDGAR has its own limit (10 requests/s), shared with enrich_filings.
concurrency:
  group: sec-edgar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

      - name: Ingest filings (SEC EDGAR)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DAYS: ${{ inputs.days }}
        run: python -m src.jobs.ingest_filings ${DAYS:+--days "$DAYS"}
