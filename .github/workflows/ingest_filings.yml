name: ingest_filings

# EDGAR fundamentals + filing metadata. Independent of the price chain.

on:
  # schedule:
  #   - cron: "0 12 * * *"   # disabled — needs valid EDGAR_USER_AGENT with real email
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Ingest filings (SEC EDGAR)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT }}
        run: python -m src.jobs.ingest_filings
