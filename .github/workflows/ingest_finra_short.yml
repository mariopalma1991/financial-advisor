name: ingest_finra_short

# FINRA short interest (twice a month per stock, published about 7 business days
# after each settlement date). Weekly, Wednesday 16:00 UTC (10:00 CST); the first
# run loads two years.

on:
  schedule:
    - cron: "0 16 * * 3"
  workflow_dispatch:
    inputs:
      since:
        description: "Load settlement dates since (YYYY-MM-DD); default two years"
        required: false
        default: ""

concurrency:
  group: finra-api
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Ingest FINRA short interest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m src.jobs.ingest_finra_short ${{ inputs.since && format('--since {0}', inputs.since) || '' }}
