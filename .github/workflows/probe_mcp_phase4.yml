name: probe_mcp_phase4
# TEMP: removed before merge
on:
  push:
    branches: [claude/project-thread-05xrjc]
    paths: [scripts/probe_mcp_phase4.py, .github/workflows/probe_mcp_phase4.yml, src/adapters/sec_risk_factors.py]
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/probe_mcp_phase4.py
