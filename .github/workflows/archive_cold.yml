name: archive_cold

# Moves heavy raw history from Postgres (0.5 GB free cap) to Parquet in the
# Supabase Storage bucket (1 GB). See src/jobs/archive_cold.py.
# On a pull request that touches the archive code it runs `check` + `export`
# (non-destructive). `prune` deletes from Postgres and only runs by hand, with
# the confirm input set to BORRAR.

on:
  pull_request:
    paths:
      - .github/workflows/archive_cold.yml
      - src/jobs/archive_cold.py
      - src/storage/archive.py
  workflow_dispatch:
    inputs:
      mode:
        description: "check | export | verify | prune"
        required: true
        default: check
        type: choice
        options: [check, export, verify, prune]
      tables:
        description: "Comma-separated tables (empty = all)"
        required: false
        default: ""
      confirm:
        description: "Type BORRAR to allow prune"
        required: false
        default: ""

concurrency:
  group: archive-cold
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
      SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Check connections
        run: python -m src.jobs.archive_cold check

      - name: Export to Storage (pull request)
        if: github.event_name == 'pull_request'
        run: |
          python -m src.jobs.archive_cold export
          python -m src.jobs.archive_cold verify

      - name: Run requested mode
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'check'
        env:
          MODE: ${{ inputs.mode }}
          TABLES: ${{ inputs.tables }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          args=("$MODE" --confirm "$CONFIRM")
          if [ -n "$TABLES" ]; then args+=(--tables "$TABLES"); fi
          python -m src.jobs.archive_cold "${args[@]}"
