name: ingest_fundamentals

# Weekly fundamentals (valuation, margins, growth, leverage) from Finnhub /stock/metric.
# Writes fundamentals_snapshot and fundamentals_quarterly (db/migrations/0007).
# Runs Tuesday 16:00 UTC (10:00 CST), after the daily filings ingest.

on:
  # No `schedule:` here: GitHub's cron ran hours late. Supabase pg_cron job `dispatch_ingest_fundamentals` fires workflow_dispatch on time (db/0028_dispatch_all.sql).
  workflow_dispatch: {}

# Finnhub allows 30 calls/min for the whole account, so Finnhub workflows run
# one at a time: a run queues while another holds the group. GitHub keeps only
# the newest pending run per group; an older pending one is cancelled.
concurrency:
  group: finnhub-api
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Ingest fundamentals (Finnhub)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m src.jobs.ingest_fundamentals