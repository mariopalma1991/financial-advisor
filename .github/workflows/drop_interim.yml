name: drop_interim

# One-off: applies db/migrations/0019 (drops interim objects from 0017).
# Removed from the branch right after it runs (rerun: view dependency).

on:
  push:
    branches: [claude/project-thread-05xrjc]
    paths: [.github/workflows/drop_interim.yml]

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Drop
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          from src.storage.supabase_client import pg_connection
          sql = Path("db/migrations/0019_drop_interim.sql").read_text(encoding="utf-8")
          with pg_connection() as conn, conn.cursor() as cur:
              cur.execute("select count(*) from investor_trades")
              print("investor_trades rows before:", cur.fetchone()[0])
              cur.execute(sql)
              cur.execute("select to_regclass('investor_trades'), to_regclass('paper_summary')")
              print("after drop:", cur.fetchone())
          PY
