name: roll_window

# Monthly rolling window (src/jobs/archive_cold.py `roll`): rows that left the
# hot window (news 180 days, price bars and filings 3 years) move to the
# Parquet archive in Supabase Storage and are deleted from Postgres, which keeps
# the database under the 0.5 GB free cap. Runs on the 2nd, after the monthly
# ingests; never alongside archive_cold.

on:
  schedule:
    - cron: "0 9 2 * *"
  workflow_dispatch: {}

concurrency:
  group: archive-cold
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
      SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Roll the hot window
        run: python -m src.jobs.archive_cold roll
