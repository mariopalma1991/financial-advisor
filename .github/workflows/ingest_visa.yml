name: ingest_visa

# Monthly visa application ingestion from Finnhub (H1-B + Permanent).
# DOL data is updated quarterly; monthly refresh catches new releases.
# Runs 1st of month at 12:00 UTC.

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch: {}

# Finnhub allows 30 calls/min for the whole account, so Finnhub workflows run
# one at a time: a run queues while another holds the group. GitHub keeps only
# the newest pending run per group; an older pending one is cancelled.
concurrency:
  group: finnhub-api
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Ingest visa applications (Finnhub)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m src.jobs.ingest_visa