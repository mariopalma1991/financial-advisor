name: committee_portfolio

# Capa 4: the Capa 2 portfolio with the committee's veto, one book per model and one
# for the majority, against Capa 2 and VOO in MXN (src/jobs/committee_portfolio.py).
# Runs after the committee and after paper_portfolio; paper_portfolio also finishes
# every 10 minutes with nothing new, so a check skips the run unless Capa 2's book or
# the committee changed since the last one.

on:
  workflow_run:
    workflows: [paper_portfolio, committee]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: committee-portfolio
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check for changes
        id: changed
        if: github.event_name == 'workflow_run'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pip install -q psycopg2-binary
          python - <<'PY'
          import os, psycopg2
          with psycopg2.connect(os.environ["SUPABASE_DB_URL"]) as conn, conn.cursor() as cur:
              cur.execute("""select greatest((select max(computed_at) from paper_nav where portfolio = 'forward_top20'),
                                             (select max(finished_at) from committee_runs))
                             > coalesce((select max(computed_at) from paper_nav where portfolio like 'capa4_%'), '-infinity')""")
              run = bool(cur.fetchone()[0])
          print(f"Capa 2 or the committee changed since the last run: {run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={str(run).lower()}\n")
          PY

      - uses: actions/checkout@v5
        if: steps.changed.outputs.run != 'false'

      - uses: actions/setup-python@v6
        if: steps.changed.outputs.run != 'false'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        if: steps.changed.outputs.run != 'false'
        run: pip install -e .

      - name: Update Capa 4 books
        if: steps.changed.outputs.run != 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: python -m src.jobs.committee_portfolio
