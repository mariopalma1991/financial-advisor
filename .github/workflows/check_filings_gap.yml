name: check_filings_gap

# One-off diagnostic: compares raw_filings (Finnhub) with EDGAR submissions for
# recent days, to see whether Finnhub's filings feed is missing or late.

on:
  push:
    branches: [claude/project-thread-05xrjc]
    paths: [.github/workflows/check_filings_gap.yml]

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      - name: Compare
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -o pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections
          from src.adapters.sec_edgar import EdgarClient, parse_index_url
          from src.storage.supabase_client import pg_connection
          from src.config import load_platform
          keep = set(load_platform().ingestion["filings"]["keep_forms"])
          with pg_connection() as conn, conn.cursor() as cur:
              cur.execute("select distinct on (ticker) ticker, url from raw_filings where url like '%%/edgar/data/%%' order by ticker, filed_at desc")
              ciks = {}
              for t, u in cur.fetchall():
                  p = parse_index_url(u)
                  if p: ciks[t] = p[0]
              cur.execute("select ticker, filed_at::date, form_type, replace(accession_no,'-','') from raw_filings where filed_at >= '2026-10-01'")
              db = {(r[0], r[3]) for r in cur.fetchall()}
              cur.execute("select ticker, filed_at::date from raw_filings where filed_at >= '2026-10-01'")
              db_days = collections.Counter(d for _, d in cur.fetchall())
          ed = EdgarClient()
          edgar_days, missing = collections.Counter(), collections.Counter()
          sample = sorted(ciks.items())
          for t, cik in sample:
              try:
                  doc = ed._get(f"https://data.sec.gov/submissions/CIK{cik:010d}.json").json()
              except Exception as e:
                  print(f"skip {t}: {e}"); continue
              r = doc["filings"]["recent"]
              for acc, form, d in zip(r["accessionNumber"], r["form"], r["filingDate"]):
                  if d < "2026-10-01" or form not in keep: continue
                  edgar_days[d] += 1
                  if (t, acc.replace("-", "")) not in db: missing[d] += 1
          print(f"tickers with CIK: {len(ciks)}\n")
          print("| day | EDGAR | in DB (Finnhub) | EDGAR missing from DB |\n|---|---|---|---|")
          for d in sorted(edgar_days, reverse=True):
              print(f"| {d} | {edgar_days[d]} | {db_days.get(__import__('datetime').date.fromisoformat(d), 0)} | {missing[d]} |")
          PY
