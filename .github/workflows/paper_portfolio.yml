name: paper_portfolio

# Model portfolio from the factor scores on the investor's budget, against VOO, in
# MXN (src/jobs/paper_portfolio.py). Runs after every successful compute_factors run,
# and within about 10 minutes of the investor changing their amount or adding a
# deposit on the "Mi inversión" page (the scheduled check skips when nothing changed).

on:
  workflow_run:
    workflows: [compute_factors]
    types: [completed]
  workflow_dispatch:
    inputs:
      check_deposits:
        description: "Only run if deposits changed since the last run (what pg_cron sends every 10 minutes)"
        type: boolean
        required: false
        default: false
  # No `schedule:` here: GitHub's cron ran hours late. Supabase pg_cron job `dispatch_paper_portfolio` fires workflow_dispatch on time (db/0028_dispatch_all.sql).

concurrency:
  group: paper-portfolio
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check for new deposits
        id: changed
        if: inputs.check_deposits == true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pip install -q psycopg2-binary
          python - <<'PY'
          import os, psycopg2
          from urllib.parse import quote, unquote
          # the password may hold '@' or ':' (same fix as supabase_client._quote_password,
          # inlined so this check needs no checkout or install)
          url = os.environ["SUPABASE_DB_URL"]
          scheme, _, rest = url.partition("://")
          if rest.count("@") >= 2:
              creds, host = rest.rsplit("@", 1)
              user, _, password = creds.partition(":")
              url = f"{scheme}://{user}:{quote(unquote(password), safe='')}@{host}"
          with psycopg2.connect(url) as conn, conn.cursor() as cur:
              cur.execute("select (select max(recorded_at) from investor_contributions) > "
                          "coalesce((select max(computed_at) from paper_nav where portfolio = 'backtest_top20'), '-infinity')")
              run = bool(cur.fetchone()[0])
          print(f"deposits changed since the last run: {run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={str(run).lower()}\n")
          PY

      - uses: actions/checkout@v5
        if: steps.changed.outputs.run != 'false'

      - uses: actions/setup-python@v6
        if: steps.changed.outputs.run != 'false'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        if: steps.changed.outputs.run != 'false'
        run: pip install -e .

      - name: Update paper portfolio
        if: steps.changed.outputs.run != 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: python -m src.jobs.paper_portfolio
