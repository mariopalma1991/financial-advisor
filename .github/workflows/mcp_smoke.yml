name: mcp_smoke

# Calls every MCP tool against the real database for a few tickers, live and as
# of a past date, checks every number resolves back through resolve_refs, and
# checks each committee role sees only its tools. Manual; run after changing the MCP.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers"
        required: false
        default: "AAPL NVDA AON APA JPM"
      as_of:
        description: "Past date to replay (YYYY-MM-DD); default a week ago"
        required: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Smoke-test MCP tools
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MCP_SMOKE_AS_OF: ${{ inputs.as_of }}
        run: python -m scripts.mcp_smoke ${{ inputs.tickers || 'AAPL NVDA AON APA JPM' }}
