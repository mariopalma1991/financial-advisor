name: mcp_smoke

# Calls every MCP tool against the real database for a few tickers and checks
# each committee role sees only its tools. Manual; run after changing the MCP.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers"
        required: false
        default: "AAPL NVDA AON APA JPM"
  push:  # TEMP: test run from the PR branch; removed before merge
    branches: [claude/project-thread-05xrjc]
    paths: [src/mcp_server/**, scripts/mcp_smoke.py, .github/workflows/mcp_smoke.yml]

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Smoke-test MCP tools
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.mcp_smoke ${{ inputs.tickers || 'AAPL NVDA AON APA JPM' }}
