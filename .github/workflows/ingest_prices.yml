name: ingest_prices

# Daily price ingestion: yfinance bars + corporate actions.
# Runs after US market close on trading days only: 02:00 UTC Tue-Sat = Mon-Fri 20:00 CST.
# Weekends have no bars (lookback 1 = the previous UTC day). Holidays still run but find nothing.

on:
  # No `schedule:` here: GitHub delayed this cron by hours. Supabase pg_cron job
  # `dispatch_ingest_prices` ('0 2 * * 2-6' UTC) calls workflow_dispatch on time
  # (see public.dispatch_workflow and the workflow_dispatch_status view).
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days to look back (raise to fill gaps after failed runs)"
        required: false
        default: "1"
      only_benchmarks:
        description: "Fetch only the benchmark ETFs (backfill them with a large lookback)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Ingest prices (yfinance)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '1' }}
          ONLY_BENCHMARKS: ${{ inputs.only_benchmarks && 'true' || 'false' }}
        run: python -m src.jobs.ingest_prices