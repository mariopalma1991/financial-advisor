name: ingest_sic

# SEC SIC codes (industry) and the peer groups built from them. Monthly, on the 2nd
# at 15:00 UTC (9:00 CST); EDGAR allows 10 requests/s, so it shares the sec-edgar group.

on:
  schedule:
    - cron: "0 15 2 * *"
  workflow_dispatch:
  push:
    branches: [claude/project-thread-05xrjc]  # TEMP: first load, removed before merge

concurrency:
  group: sec-edgar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Ingest SIC codes and peers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m src.jobs.ingest_sic
