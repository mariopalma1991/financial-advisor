name: enrich_filings

# Reads 8-K/6-K item codes and press releases (FinBERT sentiment) and Form 4
# transactions from SEC EDGAR for filings already in raw_filings.
# Mon-Sat 15:00 UTC (09:00 CST), after ingest_filings. EDGAR has its own limit
# (10 requests/s), so this runs outside the finnhub-api group.

on:
  schedule:
    - cron: "0 15 * * 1-6"
  workflow_dispatch:
    inputs:
      days:
        description: "Enrich filings filed in the last N days (backfill: 90)"
        required: false
        default: "3"
      max_minutes:
        description: "Stop cleanly after this many minutes"
        required: false
        default: "50"
      insider_only:
        description: "Form 4 only (insider-factor backfills)"
        type: boolean
        required: false
        default: false

concurrency:
  group: sec-edgar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1

      - name: Enrich filings (EDGAR)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m src.jobs.enrich_filings --days "${{ inputs.days || '3' }}" --max-minutes "${{ inputs.max_minutes || '50' }}" ${{ inputs.insider_only && '--insider-only' || '' }}
