# Paper portfolio from the factor scores (src/jobs/paper_portfolio.py), against VOO.
# Everything the investor sees is in Mexican pesos (MXN), converted with FRED DEXMXUS.

portfolio:
  n: 20                    # stocks held once the budget allows, equal weight when bought
  keep_rank: 40            # a stock held stays while ranked within this (less churn)
  max_per_industry: 5      # 25% of the portfolio (scaled down while fewer are held)
  whole_shares: true       # the SIC trades whole shares
  min_position_mxn: 2000   # fewer positions while the budget is small: 10,000 MXN -> 5
  owner: mario
  initial_mxn: 10000       # used only until the investor records deposits (investor_contributions)
  # Recurring deposit simulated in every book (forward and backtests), on top of the
  # recorded ones; "last" is the month's last day; a non-trading day moves to the next.
  recurring_mxn: 500
  recurring_days: [15, last]
  benchmark: VOO           # SPY's prices stand in until VOO has history (same index)

  # Forward test: decisions from this day on are stored once and never recomputed,
  # so later code or data changes can't rewrite them. The backtest is recomputed.
  forward_start: "2026-10-19"
  backtest_start: "2025-10-31"
  # The backtest again with these starting amounts (MXN), stored as backtest_top20_<amount>;
  # the dashboard shows the one nearest to the amount the reader types.
  backtest_amounts: [5000, 10000, 20000, 50000, 100000, 250000, 500000, 1000000]

taxes:
  isr_on_gains: 0.10          # SIC: 10% on the year's net gain, withheld by the broker
  dividend_withholding: 0.10  # assumption; check on a GBM statement

# Trading costs per side come from config/cost_model.yaml (GBM, SIC: commission with
# IVA + FX spread + slippage).
