# The day's action for the investor (src/jobs/order_alerts.py): every trading day at
# 08:00 CST, one line: VENTA x (price) - COMPRA y (price), or HOLD x (price), of the
# book they follow with the previous close, posted to Slack #alertas-factors-rank-01 (GitHub secret
# ONE_STOCK_PORTFOLIO_ALERTS_WEBHOOK, given to the job as ORDERS_WEBHOOK_URL).

# The book the investor follows: `source` top1 (top1_book_*: desde_enero or mi_inversion, from
# src/jobs/top1_portfolio.py) or paper (a paper_* portfolio such as capa4_mayoria).
# Mario 2026-10-22: the one-stock book on Mi inversión (first buy at the 2026-10-22 close).
source: top1
book: mi_inversion
rules: {n: 1, keep_rank: 1, max_per_industry: 1, min_position_mxn: 0}   # the one-stock book's rules over paper_portfolio's
recorded_deposits: true      # the Mi inversión deposits (investor_contributions) plus the recurring plan

# NYSE holidays (the books trade on US days): no message those days.
nyse_holidays: ["2026-11-26", "2026-12-25", "2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26",
                "2027-05-31", "2027-06-18", "2027-07-05", "2027-09-06", "2027-11-25", "2027-12-24"]
