# Orders for the investor (src/jobs/order_alerts.py): the night before a trading day
# with trades, the list of buys and sells of the book they follow, in whole SIC shares
# and MXN, posted to Slack (secret ORDERS_WEBHOOK_URL, else ALERT_WEBHOOK_URL). A later
# change before the close is sent as a correction.

book: capa4_mayoria          # the book the investor follows (Capa 2 with the majority veto)
compare: forward_top20       # its buys that this book doesn't make are listed (Capa 2 without the veto)
simulated: true              # paper money for now: the message says so

# While a new buy has no committee review yet, wait for it until this time (UTC) of
# the trading day; the scheduled run then sends the list as it is (08:00 CST).
wait_for_committee_until_utc: "14:00"

# NYSE holidays (the books trade on US days). The BMV ones close the SIC while New York
# trades: the message warns to place the orders the next day. Check the BMV calendar.
nyse_holidays: ["2026-11-26", "2026-12-25", "2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26",
                "2027-05-31", "2027-06-18", "2027-07-05", "2027-09-06", "2027-11-25", "2027-12-24"]
bmv_holidays: ["2026-11-16", "2026-12-25"]
