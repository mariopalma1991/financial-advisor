# Capa 3: the agent committee (src/committee). Five members analyze one candidate
# independently, each with only its own MCP tools (config/mcp_roles.yaml), then the
# chair approves or vetoes the buy. The committee is a veto over the Capa 2 factor
# list (Mario, 2026-10-19): it reviews candidates, it does not pick stocks.

committee:
  model: claude-sonnet-5-5     # Mario, 2026-10-19 (was claude-opus-5-5)
  effort: medium               # output_config.effort for every agent
  max_tokens: 16000            # per API call
  horizon_months: 6            # the horizon every agent judges (scored at 1, 4, 8 and 12 weeks)
  max_usd_per_run: 6.0         # a run stops (failed) once one ticker's committee spends this much
  prompt_version: "v0.7"
  members: [optimista, pesimista, contrario, especialista, riesgo_timing]
  chair: presidente
  # Candidates when no ticker is given: the best-ranked of the day's factor list.
  default_top_n: 20
  # Scheduled runs (workflow committee, --new-buys): only the stocks the model portfolio is
  # about to buy, at most this many per run (Mario, 2026-10-19).
  new_buys_portfolio: forward_top20
  max_new_buys: 10
  # Each scheduled run reviews those buys once per model, side by side (Mario, 2026-10-19:
  # only Sonnet and Gemini 3.8 Flash for now). Manual runs use model above unless told otherwise.
  scheduled_models: [claude-sonnet-5-5, "openrouter:google/gemini-3.8-flash"]
  # Weekly model test (Mario, 2026-10-19: to drop weak models fast): every Monday night each
  # model reviews the factor list's best weekly_top names it has not reviewed in
  # weekly_fresh_days, so every week adds new, comparable verdicts.
  weekly_models: [claude-sonnet-5-5, "openrouter:google/gemini-3.8-flash", "openrouter:deepseek/deepseek-v4-pro-0813"]
  weekly_top: 3
  weekly_fresh_days: 28

# USD per million tokens (cache writes 1.25x input, cache reads 0.1x input). Only Sonnet runs on the
# Anthropic key (Mario, 2026-10-19): --model rejects any Anthropic model not listed here.
# OpenRouter models (openrouter:<vendor/model>) are priced by OpenRouter itself.
pricing:
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_write: 2.5, cache_read: 0.20}
