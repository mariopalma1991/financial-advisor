# Platform-wide operational settings. See plans/data-engineering-platform-plan.md §12.

platform:
  timezone: America/Mexico_City

ingestion:
  prices:
    # After US market close, Tue-Sat UTC
    schedule_cron: "0 1 * * 2-6"
    backfill_years_analysis: 3
    backfill_years_screening: 1
  filings:
    # Source: SEC EDGAR submissions (one call per company, 10 requests/s), so
    # the whole universe is read every run; no Finnhub quota.
    lookback_days: 30
    # Only these forms are stored; the rest (prospectus supplements, S-8, 13F,
    # proxy soliciting material...) never reaches an agent. 6-K/20-F/40-F are the
    # foreign-issuer equivalents of 8-K/10-K, needed for the ADRs listed on the SIC.
    keep_forms: [
      "8-K", "8-K/A", "6-K", "10-K", "10-K/A", "10-Q", "10-Q/A", "20-F", "20-F/A", "40-F",
      "4", "4/A", "144", "144/A",
      "SC 13D", "SC 13D/A", "SCHEDULE 13D", "SCHEDULE 13D/A",
      "SC 13G", "SC 13G/A", "SCHEDULE 13G", "SCHEDULE 13G/A",
      "DEF 14A", "DEFM14A", "PREM14A", "425", "SC TO-T", "SC TO-I", "SC 14D9", "S-1", "S-1/A",
    ]
  news: # Phase 2
    schedule_cron: "0 13,19,23 * * *"
    # 3 runs/day x 300 symbols rotates through the universe about every 1.3 days.
    # Finnhub plan: 30 calls/min -> 2.1 s apart; 300 x 2.1 s = 10.5 min < budget.
    call_delay_s: 2.1
    max_symbols_per_run: 300
    fetch_budget_min: 12
    lookback_days: 3

indicators:
  sma_windows: [10, 20, 50, 200]
  ema_windows: [10, 20, 50, 200]
  rsi_period: 14          # Wilder
  macd: { fast: 12, slow: 26, signal: 9 }
  atr_period: 14
  bollinger: { window: 20, num_std: 2.0 }
  volume_ma_window: 20
  relative_strength_window_days: 21  # ~1 trading month vs benchmark

horizons:
  # Trading-day windows matching the three-tier design (tactical / trade / regime)
  returns_windows: { "5d": 5, "1m": 21, "3m": 63, "6m": 126, "12m": 252 }
  sentiment_windows: { "1d": 1, "3d": 3, "7d": 7, "30d": 30 }
  catalyst_lookahead_days: 60

quality:
  price_divergence_pct: 0.005   # 0.5% close divergence between sources -> alert
  price_staleness_hours: 36
  screener_zero_days_alert: 5   # a screen flagging nothing for 5 straight days -> alert

feeds:
  top_news_items: 10
